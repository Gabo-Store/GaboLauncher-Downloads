name: Sign published installers with Sigstore
on:
  workflow_dispatch:
permissions: {}
jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify inputs, sign, test and publish detached signatures
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir signatures
          cd signatures
          curl --fail --location --retry 3 -o cosign https://github.com/sigstore/cosign/releases/download/v3.1.3/cosign-linux-amd64
          echo '4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71  cosign' | sha256sum --check
          chmod +x cosign
          curl --fail --location --retry 3 -o GaboLauncher-Setup-0.9.1-x64.exe https://gabo-licencias.gabostorecodex.workers.dev/releases/GaboLauncher-Setup-0.9.1-x64.exe
          curl --fail --location --retry 3 -o GaboLauncher-0.9.0-mac.1-arm64.dmg https://github.com/Gabo-Store/GaboLauncher-Downloads/releases/download/mac-0.9.0-mac.1/GaboLauncher-0.9.0-mac.1-arm64.dmg
          curl --fail --location --retry 3 -o GaboLauncher-0.9.0-mac.1-x64.dmg https://github.com/Gabo-Store/GaboLauncher-Downloads/releases/download/mac-0.9.0-mac.1/GaboLauncher-0.9.0-mac.1-x64.dmg
          cat > SHA256SUMS.txt <<'SUMS'
          cf349c683e26f620b4835b67f233ac61662f8f35d61ac12ded5d41aedade653e  GaboLauncher-Setup-0.9.1-x64.exe
          72d9abdb996ac3f81953ba8aa35fb1a8f4900c26d72c3825a70e5dc89b8236b0  GaboLauncher-0.9.0-mac.1-arm64.dmg
          b28dec0ef0bbae7e6b4fc1834f2c989ce208b49f04b16670e65f00c3872666ab  GaboLauncher-0.9.0-mac.1-x64.dmg
          SUMS
          sha256sum --check SHA256SUMS.txt
          identity='https://github.com/Gabo-Store/GaboLauncher-Downloads/.github/workflows/sign-distribution.yml@refs/heads/main'
          issuer='https://token.actions.githubusercontent.com'
          for file in GaboLauncher-Setup-0.9.1-x64.exe GaboLauncher-0.9.0-mac.1-arm64.dmg GaboLauncher-0.9.0-mac.1-x64.dmg; do
            ./cosign sign-blob --yes --bundle "$file.sigstore.json" "$file"
            ./cosign verify-blob --bundle "$file.sigstore.json" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$file"
          done
          cp GaboLauncher-Setup-0.9.1-x64.exe altered-test.exe
          printf '\0' >> altered-test.exe
          if ./cosign verify-blob --bundle GaboLauncher-Setup-0.9.1-x64.exe.sigstore.json --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" altered-test.exe; then
            echo 'ERROR: altered file accepted'
            exit 1
          fi
          if ./cosign verify-blob --bundle GaboLauncher-Setup-0.9.1-x64.exe.sigstore.json --certificate-identity 'https://example.invalid/another-publisher' --certificate-oidc-issuer "$issuer" GaboLauncher-Setup-0.9.1-x64.exe; then
            echo 'ERROR: wrong publisher accepted'
            exit 1
          fi
          cat > LEEME-FIRMAS.md <<'DOC'
          # Firmas gratuitas de distribución

          Firmas separadas Sigstore/Cosign para los instaladores originales publicados. No se modifica el EXE ni los DMG y no se cambia el instalador vigente.

          Estas firmas permiten verificar el origen de publicación y detectar cambios. NO son Authenticode de Windows, Developer ID de Apple ni notarización. No eliminan advertencias de SmartScreen o Gatekeeper. No prueban cómo se compiló el motor cerrado ni garantizan compatibilidad con todos los juegos.

          Descarga Cosign desde https://github.com/sigstore/cosign/releases y el bundle correspondiente. Verifica, sustituyendo ARCHIVO por el nombre exacto del instalador:

          ```sh
          cosign verify-blob --bundle ARCHIVO.sigstore.json --certificate-identity https://github.com/Gabo-Store/GaboLauncher-Downloads/.github/workflows/sign-distribution.yml@refs/heads/main --certificate-oidc-issuer https://token.actions.githubusercontent.com ARCHIVO
          ```

          La identidad debe coincidir exactamente. Las firmas incluyen certificado efímero y prueba de inclusión en el registro público de transparencia. No contienen claves privadas ni licencias de clientes.

          Pruebas automáticas: los tres archivos originales pasan; un EXE alterado y una identidad distinta son rechazados.
          DOC
          gh release create firmas-0.9.1-mac.1 --repo "$GITHUB_REPOSITORY" --draft --title 'Firmas verificables gratuitas de Windows 0.9.1 y Mac 0.9.0-mac.1' --notes-file LEEME-FIRMAS.md
          gh release upload firmas-0.9.1-mac.1 --repo "$GITHUB_REPOSITORY" ./*.sigstore.json SHA256SUMS.txt LEEME-FIRMAS.md
          gh release edit firmas-0.9.1-mac.1 --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
          echo 'Original signatures verified; altered artifact and wrong identity rejected.' >> "$GITHUB_STEP_SUMMARY"
